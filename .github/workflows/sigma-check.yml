name: sigma-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install sigma-cli
        run: pip install sigma-cli

      - name: Validate rules
        run: sigma check rules/
